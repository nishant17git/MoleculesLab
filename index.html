<script>
    /* =========================================
       AUDIO & HAPTICS 
       ========================================= */
    const AudioEngine = (function() {
        let ctx = null;
        const customCoinSound = new Audio('https://www.image2url.com/r2/default/audio/1780284469302-090a554c-9a5c-4622-8126-4ac945d8d97f.mp3'); 
        customCoinSound.preload = 'auto';
        
        function init() {
            if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (ctx.state === 'suspended') ctx.resume();
            customCoinSound.load();
        }

        function playCoinToss() {
            customCoinSound.currentTime = 0; 
            customCoinSound.play().catch(err => console.log("Audio playing prevented:", err));
        }

        function playCoinCatch() { if(navigator.vibrate) navigator.vibrate([40]); }
        
        function playWhoosh() {
            if (!ctx) return;
            const bufferSize = ctx.sampleRate * 2.0; 
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            
            const noise = ctx.createBufferSource(); noise.buffer = buffer;
            const filter = ctx.createBiquadFilter(); filter.type = 'lowpass';
            filter.frequency.setValueAtTime(200, ctx.currentTime);
            filter.frequency.linearRampToValueAtTime(2000, ctx.currentTime + 1);
            filter.frequency.linearRampToValueAtTime(100, ctx.currentTime + 2);
            
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 1);
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 2);
            
            noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
            noise.start(); noise.stop(ctx.currentTime + 2);
        }

        function playThud() {
            if (!ctx) return;
            const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.8, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.4);
            if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }

        return { init, playCoinToss, playCoinCatch, playWhoosh, playThud };
    })();

    /* =========================================
       STATISTICS (WITH 3D ODOMETER ANIMATION)
       ========================================= */
    const StatsManager = (function() {
        let stats = JSON.parse(localStorage.getItem('molecules_stats')) || { heads: 0, tails: 0 };
        
        function save() { localStorage.setItem('molecules_stats', JSON.stringify(stats)); }
        
        function initRender() {
            document.getElementById('stat-heads').innerText = stats.heads;
            document.getElementById('stat-tails').innerText = stats.tails;
        }

        function animateNumber(elementId, newValue) {
            const container = document.getElementById(elementId + '-container');
            const currentEl = container.querySelector('.current-val');
            
            const newEl = document.createElement('div');
            newEl.className = 'absolute current-val text-white w-full text-center';
            newEl.innerText = newValue;
            
            gsap.set(newEl, { y: '100%', opacity: 0, rotationX: -80, scale: 0.8, transformStyle: "preserve-3d" });
            container.appendChild(newEl);
            
            gsap.to(currentEl, { 
                y: '-100%', opacity: 0, rotationX: 80, scale: 0.8, 
                duration: 0.9, ease: "expo.inOut",
                onComplete: () => currentEl.remove()
            });
            
            gsap.to(newEl, { 
                y: '0%', opacity: 1, rotationX: 0, scale: 1, 
                duration: 0.9, ease: "expo.inOut"
            });
        }

        function record(result) {
            if (result === 'HEADS') {
                stats.heads++;
                animateNumber('stat-heads', stats.heads);
            } else if (result === 'TAILS') {
                stats.tails++;
                animateNumber('stat-tails', stats.tails);
            }
            save();
        }

        function reset() {
            stats = { heads: 0, tails: 0 };
            save();
            animateNumber('stat-heads', 0);
            animateNumber('stat-tails', 0);
        }
        
        return { init: initRender, record, reset };
    })();

    document.getElementById('reset-stats-btn').addEventListener('click', () => {
        StatsManager.reset();
    });

    /* =========================================
       THREE.JS SCENE
       ========================================= */
    const canvasContainer = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    canvasContainer.appendChild(renderer.domElement);

    function updateCamera() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.position.z = window.innerWidth < 768 ? 16 : 12;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', updateCamera); updateCamera(); 

    // STUDIO LIGHTING
    scene.add(new THREE.AmbientLight(0xffffff, 0.05));
    
    const frontFill = new THREE.DirectionalLight(0xffffff, 0.6);
    frontFill.position.set(0, 5, 5); scene.add(frontFill);

    const rimLight1 = new THREE.SpotLight(0xffffff, 6);
    rimLight1.position.set(5, 5, -5); rimLight1.lookAt(0, 0, 0); rimLight1.penumbra = 0.5; scene.add(rimLight1);

    const rimLight2 = new THREE.SpotLight(0xffffff, 3);
    rimLight2.position.set(-5, -5, -5); rimLight2.lookAt(0, 0, 0); rimLight2.penumbra = 0.5; scene.add(rimLight2);

    const pointLight = new THREE.PointLight(0xffffff, 2, 20);
    pointLight.position.set(0, 2, 5); scene.add(pointLight);

    /* =========================================
       OBJECT CREATION
       ========================================= */
    function createCoinTexture(text, isTails = false) {
        const canvas = document.createElement('canvas'); canvas.width = 1024; canvas.height = 1024;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#030303'; ctx.fillRect(0, 0, 1024, 1024);
        
        ctx.strokeStyle = '#222'; ctx.lineWidth = 12; ctx.beginPath(); ctx.arc(512, 512, 480, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = '#333'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(512, 512, 450, 0, Math.PI * 2); ctx.stroke();
        
        ctx.fillStyle = '#e5e5e5'; ctx.font = 'bold 320px "Syne", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        
        ctx.translate(512, 512); ctx.rotate(-Math.PI / 2);
        if (isTails) ctx.rotate(Math.PI); 
        ctx.fillText(text, 0, 15); ctx.translate(-512, -512);
        
        const texture = new THREE.CanvasTexture(canvas); texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        return texture;
    }

    const coinGroup = new THREE.Group(); const coinWrapper = new THREE.Group();
    coinGroup.add(coinWrapper); scene.add(coinGroup);

    const coinGeometry = new THREE.CylinderGeometry(2.5, 2.5, 0.2, 64);
    const edgeMaterial = new THREE.MeshPhysicalMaterial({ color: 0x333333, metalness: 1.0, roughness: 0.1, clearcoat: 1.0 });
    const faceMaterialConfig = { metalness: 0.9, roughness: 0.25, clearcoat: 0.2 };
    
    const headsMaterial = new THREE.MeshPhysicalMaterial({ ...faceMaterialConfig, map: createCoinTexture('H', false) });
    const tailsMaterial = new THREE.MeshPhysicalMaterial({ ...faceMaterialConfig, map: createCoinTexture('T', true) });

    const coinMesh = new THREE.Mesh(coinGeometry, [edgeMaterial, headsMaterial, tailsMaterial]);
    coinMesh.rotation.x = Math.PI / 2; coinWrapper.add(coinMesh);

    // GYROSCOPE
    const gyroGroup = new THREE.Group(); gyroGroup.visible = false; scene.add(gyroGroup);
    const ringMaterial = new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 1.0, roughness: 0.05, clearcoat: 1.0 });
    const rings = []; const ringConfig = [[2.6, 0.02], [2.1, 0.04], [1.6, 0.06]];
    
    ringConfig.forEach(([radius, thickness], index) => {
        const geometry = new THREE.TorusGeometry(radius, thickness, 64, 128);
        const mesh = new THREE.Mesh(geometry, ringMaterial);
        mesh.userData = {
            speedX: (index % 2 === 0 ? 1 : -1) * (0.005 + Math.random() * 0.01),
            speedY: (index % 3 === 0 ? 1 : -1) * (0.005 + Math.random() * 0.01),
            speedZ: (index % 2 !== 0 ? 1 : -1) * (0.005 + Math.random() * 0.01)
        };
        rings.push(mesh); gyroGroup.add(mesh);
    });

    const clock = new THREE.Clock(); let currentMode = 'coin'; let isAnimating = false;

    function startGyroIdle() {
        rings.forEach((ring, index) => {
            gsap.to(ring.rotation, {
                x: `${index % 2 === 0 ? "+=" : "-="}${Math.PI * 2}`, duration: 12 + index * 2, repeat: -1, ease: "none"
            });
            gsap.to(ring.rotation, {
                y: `${index % 3 === 0 ? "+=" : "-="}${Math.PI * 2}`, duration: 15 - index, repeat: -1, ease: "none"
            });
            gsap.to(ring.rotation, {
                z: `${index % 2 !== 0 ? "+=" : "-="}${Math.PI * 2}`, duration: 10 + index * 3, repeat: -1, ease: "none"
            });
        });
    }

    startGyroIdle();

    function renderLoop() {
        requestAnimationFrame(renderLoop);
        const elapsedTime = clock.getElapsedTime();

        if (!isAnimating && currentMode === 'coin') {
            coinGroup.rotation.y = Math.sin(elapsedTime * 0.6) * 0.15;
            coinGroup.rotation.x = Math.cos(elapsedTime * 0.4) * 0.15;
            coinGroup.position.y = Math.sin(elapsedTime * 1.5) * 0.1;
        }

        if (!isAnimating && currentMode === 'yesno') {
            gyroGroup.position.y = Math.sin(elapsedTime * 1.5) * 0.1;
        }

        renderer.render(scene, camera);
    }

    /* =========================================
       TEXT ENGINE
       ========================================= */
    const resultDisplay = document.getElementById('result-display');
    function splitTextForAnimation(text) {
        resultDisplay.innerHTML = ''; const charElements = [];
        text.split('').forEach(char => {
            const mask = document.createElement('span'); mask.className = 'char-mask';
            const inner = document.createElement('span'); inner.className = 'char-inner'; inner.innerText = char;
            if(char === ' ') mask.style.width = '0.3em';
            mask.appendChild(inner); resultDisplay.appendChild(mask); charElements.push(inner);
        });
        return charElements;
    }

    function hideCurrentResult() {
        const currentChars = resultDisplay.querySelectorAll('.char-inner');
        if (currentChars.length === 0) return Promise.resolve();
        return new Promise(resolve => {
            gsap.to(currentChars, { y: '-110%', rotationZ: -10, opacity: 0, duration: 0.5, ease: "expo.in", stagger: 0.02, onComplete: resolve });
        });
    }

    function showResult(text) {
        const chars = splitTextForAnimation(text);
        gsap.fromTo(chars, 
            { y: '110%', rotationZ: 15, scale: 0.9, opacity: 0 },
            { y: '0%', rotationZ: 0, scale: 1, opacity: 1, duration: 1.2, ease: "expo.out", stagger: 0.05 }
        );
    }

    /* =========================================
       INTERACTION
       ========================================= */
    const actionBtn = document.getElementById('action-btn');

    function performCoinToss() {
        if(isAnimating) return;
        isAnimating = true; AudioEngine.init();
        
        hideCurrentResult();
        const isHeads = Math.random() > 0.5;
        const resultText = isHeads ? 'HEADS' : 'TAILS';
        const targetRotX = (Math.floor(coinWrapper.rotation.x / (Math.PI * 2)) + 5) * (Math.PI * 2) + (isHeads ? 0 : Math.PI);

        const tl = gsap.timeline({
            onComplete: () => {
                isAnimating = false; StatsManager.record(resultText); showResult(resultText); AudioEngine.playCoinCatch();
            }
        });

        tl.to(coinGroup.position, { y: 5, duration: 1, ease: "power2.out" }, 0);
        tl.to(coinWrapper.rotation, { x: targetRotX, duration: 2.2, ease: "expo.inOut", onStart: () => AudioEngine.playCoinToss() }, 0);
        tl.to(coinGroup.position, { y: 0, duration: 1, ease: "bounce.out" }, 1.2);
    }

    function performDecision() {
        if(isAnimating) return;
        isAnimating = true; AudioEngine.init();
        
        hideCurrentResult(); AudioEngine.playWhoosh();
        const resultText = Math.random() > 0.5 ? 'YES' : 'NO';
        
        gsap.killTweensOf(rings.map(r => r.rotation));
        const tl = gsap.timeline();
        
        rings.forEach((ring, index) => {
            const targetX = Math.ceil(ring.rotation.x / (Math.PI * 2)) * (Math.PI * 2) + (Math.PI * 2 * (4 + (index % 2 === 0 ? 1 : -1)));
            const targetY = Math.ceil(ring.rotation.y / (Math.PI * 2)) * (Math.PI * 2) + (Math.PI * 2 * (4 + index));
            const targetZ = Math.ceil(ring.rotation.z / (Math.PI * 2)) * (Math.PI * 2);
            tl.to(ring.rotation, { x: targetX, y: targetY, z: targetZ, duration: 2.5, ease: "expo.inOut" }, 0);
        });

        tl.call(() => AudioEngine.playThud(), [], 2.4);
        tl.call(() => { showResult(resultText); }, [], 2.5);
        tl.call(() => { isAnimating = false; startGyroIdle(); }, [], 4.5);
    }

    actionBtn.addEventListener('click', () => {
        if(currentMode === 'coin') performCoinToss(); else performDecision();
    });

    window.switchMode = function(mode) {
        if(isAnimating || currentMode === mode) return;
        currentMode = mode;
        
        const indicator = document.getElementById('nav-indicator');
        const tabs = document.querySelectorAll('.nav-tab');

        if (mode === 'yesno') {
            indicator.style.transform = 'translateX(100%)';
            tabs[0].classList.replace('text-black', 'text-white/50'); tabs[0].classList.add('hover:text-white');
            tabs[1].classList.replace('text-white/50', 'text-black'); tabs[1].classList.remove('hover:text-white');
        } else {
            indicator.style.transform = 'translateX(0)';
            tabs[1].classList.replace('text-black', 'text-white/50'); tabs[1].classList.add('hover:text-white');
            tabs[0].classList.replace('text-white/50', 'text-black'); tabs[0].classList.remove('hover:text-white');
        }

        hideCurrentResult();
        actionBtn.innerText = mode === 'coin' ? 'TOSS' : 'ASK';

        gsap.to(mode === 'coin' ? gyroGroup.scale : coinGroup.scale, {
            x: 0, y: 0, z: 0, duration: 0.4, ease: "back.in(1.7)",
            onComplete: () => {
                if(mode === 'coin') {
                    gyroGroup.visible = false; coinGroup.visible = true;
                    document.getElementById('coin-stats').classList.remove('invisible-custom'); document.getElementById('yesno-info').classList.add('invisible-custom');
                } else {
                    coinGroup.visible = false; gyroGroup.visible = true;
                    document.getElementById('coin-stats').classList.add('invisible-custom'); document.getElementById('yesno-info').classList.remove('invisible-custom');
                }
                gsap.fromTo(mode === 'coin' ? coinGroup.scale : gyroGroup.scale,
                    { x: 0, y: 0, z: 0 }, { x: 1, y: 1, z: 1, duration: 0.8, ease: "elastic.out(1, 0.5)" }
                );
            }
        });
    }

    /* =========================================
       INITIALIZATION & DUTCH LOADER SEQUENCE
       ========================================= */
    function init() {
        StatsManager.init();
        
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => { gsap.to(cursor, { x: e.clientX, y: e.clientY, duration: 0.1, ease: "power2.out" }); });

        const tl = gsap.timeline();
        const loader = document.getElementById('loader');
        const typoStroke = document.getElementById('loader-typo-stroke');
        const typoSolid = document.getElementById('loader-typo-solid');
        const status = document.getElementById('loader-status');
        
        // 1. Reveal corner texts
        tl.fromTo('.loader-reveal', { y: '100%', opacity: 0 }, { y: '0%', opacity: 1, duration: 0.8, stagger: 0.1, ease: "expo.out" });

        let progress = { val: 0 };
        
        function updateLoader() {
            const val = Math.floor(progress.val);
            const displayVal = val.toString().padStart(3, '0');
            
            typoStroke.innerText = displayVal;
            typoSolid.innerText = displayVal;
            
            typoSolid.style.clipPath = `inset(${100 - val}% 0 0 0)`;

            if(val > 15 && val < 45) status.innerText = 'Isolating Variables';
            else if(val >= 45 && val < 80) status.innerText = 'Calculating Chance';
            else if(val >= 80) status.innerText = 'Awaiting Input';
        }

        // 2. Stuttered, heavy loading sequence
        tl.to(progress, { val: 18, duration: 0.4, ease: "power2.out", onUpdate: updateLoader }, "+=0.2");
        tl.to(progress, { val: 18, duration: 0.2 }); 
        tl.to(progress, { val: 56, duration: 0.7, ease: "power4.inOut", onUpdate: updateLoader });
        tl.to(progress, { val: 56, duration: 0.15 }); 
        tl.to(progress, { val: 89, duration: 0.5, ease: "power2.inOut", onUpdate: updateLoader });
        tl.to(progress, { val: 89, duration: 0.25 }); 
        tl.to(progress, { val: 100, duration: 0.6, ease: "expo.out", onUpdate: updateLoader });

        // 3. The Exit Wipe
        tl.to([typoStroke, typoSolid], { 
            scale: 1.05, letterSpacing: '0.04em', duration: 0.5, ease: "power3.inOut" 
        });
        
        tl.to('.loader-reveal', { y: '-100%', opacity: 0, duration: 0.5, ease: "expo.in", stagger: 0.05 }, "-=0.3");
        
        tl.to(loader, { 
            clipPath: 'inset(50% 0 50% 0)',
            duration: 0.8, 
            ease: "expo.inOut",
            onComplete: () => { loader.style.display = 'none'; }
        }, "-=0.1");

        // 4. Scene flies in right as the mask opens
        tl.fromTo(coinGroup.position, { y: 15, z: -10 }, { y: 0, z: 0, duration: 2, ease: "expo.out" }, "-=0.6");
        tl.fromTo(coinWrapper.rotation, { x: Math.PI * 4, z: Math.PI / 2 }, { x: 0, z: 0, duration: 2.5, ease: "power3.out" }, "-=1.8");
        tl.to('#ui-layer', { opacity: 1, duration: 1, ease: "power2.out" }, "-=1.5");

        renderLoop();
    }

    window.onload = init;

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Registration failed:', err));
        });

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-btn').classList.remove('hidden-custom');
        });

        document.getElementById('install-btn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                await deferredPrompt.userChoice;
                deferredPrompt = null;
                document.getElementById('install-btn').classList.add('hidden-custom');
            }
        });
    }

</script>
</body>
</html>
