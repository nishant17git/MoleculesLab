<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050505">
    <meta name="description" content="Experimental Features | Molecules Lab">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Molecules Lab</title>

    <!-- Icons & manifest -->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
    <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
    <link rel="manifest" href="manifest.webmanifest">

    <!-- Start the connections to third-party hosts early (first visit only; afterwards everything is cached) -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>

    <!-- App styles (small, local, render-blocking on purpose so the loader paints correctly on frame one) -->
    <link rel="stylesheet" href="src/css/base.css">
    <link rel="stylesheet" href="src/css/loader.css">
    <link rel="stylesheet" href="src/css/layout.css">
    <link rel="stylesheet" href="src/css/panels.css">
    <link rel="stylesheet" href="src/css/controls.css">
    <link rel="stylesheet" href="src/css/result.css">
    <link rel="stylesheet" href="src/css/feedback.css">

    <!-- Web fonts: loaded without blocking first paint (media=print → all on load). Only the weights the app uses. -->
    <link rel="stylesheet" data-font-css media="print"
          onload="this.media='all';this.dataset.state='loaded'" onerror="this.dataset.state='error'"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Matangi:wght@500;600&family=Space+Grotesk:wght@700&family=Syne:wght@700;800&display=swap">
    <link rel="stylesheet" data-font-css media="print"
          onload="this.media='all';this.dataset.state='loaded'" onerror="this.dataset.state='error'"
          href="https://api.fontshare.com/v2/css?f[]=clash-display@600&display=swap">

    <!-- 3D + animation libraries (pinned versions). Deferred so they never block first paint; cached by the service worker. -->
    <script defer crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script defer crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <!-- Generated by scripts/build.mjs — preloads the app's module graph in one round trip -->
    <!-- modulepreload:start -->
    <link rel="modulepreload" href="src/js/main.js">
    <link rel="modulepreload" href="src/js/app/boot.js">
    <link rel="modulepreload" href="src/js/app/toss-controller.js">
    <link rel="modulepreload" href="src/js/audio/audio-engine.js">
    <link rel="modulepreload" href="src/js/config.js">
    <link rel="modulepreload" href="src/js/pwa/connectivity.js">
    <link rel="modulepreload" href="src/js/pwa/install-prompt.js">
    <link rel="modulepreload" href="src/js/pwa/service-worker-client.js">
    <link rel="modulepreload" href="src/js/scene/coin.js">
    <link rel="modulepreload" href="src/js/scene/gyroscope.js">
    <link rel="modulepreload" href="src/js/scene/lighting.js">
    <link rel="modulepreload" href="src/js/scene/quality.js">
    <link rel="modulepreload" href="src/js/scene/stage.js">
    <link rel="modulepreload" href="src/js/storage/safe-storage.js">
    <link rel="modulepreload" href="src/js/storage/stats-store.js">
    <link rel="modulepreload" href="src/js/ui/custom-cursor.js">
    <link rel="modulepreload" href="src/js/ui/loader-screen.js">
    <link rel="modulepreload" href="src/js/ui/mode-nav.js">
    <link rel="modulepreload" href="src/js/ui/result-display.js">
    <link rel="modulepreload" href="src/js/ui/stats-panel.js">
    <link rel="modulepreload" href="src/js/ui/toast.js">
    <link rel="modulepreload" href="src/js/utils/async.js">
    <link rel="modulepreload" href="src/js/utils/device.js">
    <link rel="modulepreload" href="src/js/utils/dom.js">
    <link rel="modulepreload" href="src/js/utils/fonts.js">
    <link rel="modulepreload" href="src/js/utils/perf.js">
    <!-- modulepreload:end -->

    <script type="module" src="src/js/main.js"></script>
</head>
<body>
    <noscript>
        <div style="position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:#050505;color:#fff;font:13px sans-serif;text-align:center;padding:2rem">
            Molecules Lab needs JavaScript to run.
        </div>
    </noscript>

    <div id="cursor" class="cursor" aria-hidden="true"></div>

    <!-- Loading screen. Everything here paints on the first frame, before any script has run. -->
    <div id="loader" class="loader" aria-busy="true">
        <div class="loader__row loader__row--top">
            <div class="loader__mask"><div class="loader__label" style="--i:0">Molecules Lab</div></div>
            <div class="loader__mask"><div class="loader__label" style="--i:1">SYS.v.0.9</div></div>
        </div>

        <div class="loader__counter" aria-hidden="true">
            <div id="loader-stroke" class="loader__digits loader__digits--stroke">
                <span class="loader__digit">0</span><span class="loader__digit">0</span><span class="loader__digit">0</span>
            </div>
            <div id="loader-solid" class="loader__digits loader__digits--solid">
                <span class="loader__digit">0</span><span class="loader__digit">0</span><span class="loader__digit">0</span>
            </div>
        </div>

        <div class="loader__row loader__row--bottom">
            <div class="loader__mask"><div class="loader__label" style="--i:2">Quantum Alignment</div></div>
            <div class="loader__mask"><div id="loader-status" class="loader__label loader__label--status" style="--i:3" role="status">Initializing</div></div>
        </div>

        <!-- Shown instead of the counter if start-up fails (e.g. first visit while offline) -->
        <div class="loader__error">
            <p id="loader-error-title" class="loader__error-title"></p>
            <p id="loader-error-message" class="loader__error-message"></p>
            <button id="loader-retry" class="pill-btn" type="button">Try again</button>
        </div>
    </div>

    <!-- WebGL canvas is injected here -->
    <div id="canvas-container" class="scene"></div>

    <div id="ui-layer" class="ui-layer">
        <header class="app-header">
            <div class="brand">
                <svg class="brand__logo" role="img" aria-label="Molecules Lab" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <g transform="translate(0,600) scale(0.1,-0.1)" stroke="none">
                        <path d="M1451 3027 c-327 -776 -596 -1415 -598 -1420 -3 -4 136 -6 307 -5 l311 3 285 680 c157 374 288 683 292 687 4 3 108 -235 231 -530 124 -295 254 -606 289 -689 l64 -153 310 0 c244 0 309 3 305 13 -3 6 -71 170 -153 362 -81 193 -147 355 -147 360 0 19 266 645 272 640 3 -3 134 -313 291 -688 l285 -682 311 -3 312 -2 -589 1397 c-324 769 -594 1409 -600 1423 -9 21 -12 22 -20 9 -7 -14 -548 -1291 -568 -1343 -7 -18 -44 68 -480 1101 -58 139 -108 253 -111 253 -3 0 -272 -636 -599 -1413z"/>
                        <path d="M4810 2161 c-84 -18 -174 -91 -208 -170 -24 -56 -21 -176 6 -227 55 -106 127 -155 238 -162 92 -6 149 14 212 72 61 56 84 106 90 194 4 66 2 78 -27 137 -33 66 -81 114 -143 140 -44 18 -123 26 -168 16z"/>
                    </g>
                </svg>

                <button id="install-btn" class="pill-btn interactive" type="button" hidden>Install App</button>
            </div>

            <nav id="mode-nav" class="mode-nav interactive" data-mode="coin" aria-label="Mode">
                <div class="mode-nav__indicator" aria-hidden="true"></div>
                <button class="mode-nav__tab is-active" type="button" data-select="coin" aria-pressed="true">COIN</button>
                <button class="mode-nav__tab" type="button" data-select="yesno" aria-pressed="false">YES / NO</button>
            </nav>
        </header>

        <div class="result">
            <div id="result-display" class="result__text" aria-hidden="true"></div>
            <div id="result-live" class="sr-only" role="status"></div>
        </div>

        <section id="coin-stats" class="info-panel glass-panel interactive" aria-label="Coin statistics">
            <button id="reset-stats-btn" class="stats__reset interactive" type="button">Reset</button>

            <div class="stats__row">
                <div class="stats__cell">
                    <div id="stat-heads-container" class="stats__number font-number">
                        <div id="stat-heads" class="stats__value">0</div>
                    </div>
                    <div class="stats__label">Heads</div>
                </div>

                <div class="stats__divider" aria-hidden="true"></div>

                <div class="stats__cell">
                    <div id="stat-tails-container" class="stats__number font-number">
                        <div id="stat-tails" class="stats__value">0</div>
                    </div>
                    <div class="stats__label">Tails</div>
                </div>
            </div>
        </section>

        <section id="yesno-info" class="info-panel glass-panel interactive is-inactive" lang="hi" aria-label="Yes or No">
            <h2 class="verse__title font-devanagari">भ्रम निवारक</h2>
            <p class="verse__text font-devanagari">
                संशय की यह कोठरी, मन भटकावे नीत।<br>चक्र थमे जो एक पर, समझो ओही मीत॥
            </p>
        </section>

        <button id="action-btn" class="action-btn interactive" type="button">TOSS</button>
    </div>

    <!-- Quiet status messages: offline-ready, connection changes, update available -->
    <div id="toast" class="toast" role="status" aria-live="polite" data-tone="neutral">
        <span class="toast__dot" aria-hidden="true"></span>
        <span class="toast__text"></span>
        <button class="toast__action" type="button" hidden></button>
    </div>
</body>
</html>
